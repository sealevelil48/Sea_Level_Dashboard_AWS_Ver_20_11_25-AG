name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sealevel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lambda.txt
      - name: Install
        run: pip install -r requirements-lambda.txt pytest httpx flake8
      - name: Lint (errors only)
        run: flake8 --select=E9,F63,F7,F82 --exclude=tests/legacy,optimizations,venv .
      - name: Test (real PostgreSQL)
        env:
          TEST_DB_URI: postgresql+psycopg2://ci:ci@localhost:5432/sealevel_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npx react-scripts test --watchAll=false --passWithNoTests
        env:
          CI: 'true'
      - name: Build
        run: npm run build
        env:
          CI: 'false'            # existing no-console warnings are not yet errors
          REACT_APP_API_URL: ''
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint --regions il-central-1 -- infra/template.yaml
      - name: Build Lambda image (no push)
        run: docker build --platform linux/amd64 -f backend/Dockerfile.lambda -t sealevel-backend:ci backend
