AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sea Level Dashboard - CloudFront WAF ("AWS WAF - Request Filtering" in the architecture).
  CloudFront web ACLs must be created in us-east-1. Deploy this once per environment there, then pass
  the WebAclArn output to the main stack as CloudFrontWebAclArn.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  RateLimitPer5Min:
    Type: Number
    Default: 3000

Resources:
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub sealevel-cloudfront-${Env}
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub 'sealevel-cf-${Env}' }
      Rules:
        - Name: rate-limit
          Priority: 0
          Action: { Block: {} }
          Statement: { RateBasedStatement: { Limit: !Ref RateLimitPer5Min, AggregateKeyType: IP } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-limit }
        - Name: aws-ip-reputation
          Priority: 1
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-reputation }
        - Name: aws-common
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules: [{ Name: SizeRestrictions_BODY }]
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-common }
        - Name: aws-bad-inputs
          Priority: 3
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-bad-inputs }

Outputs:
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
